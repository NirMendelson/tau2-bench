workflow: Refund
when: "if the user mention he has a problem with a flight or reservation, and he wants a refund or compensation"

keywords:
  - refund
  - compensation
  - money back
  


examples:
  - "I want a refund"
  - "I want compensation"
  - "Can I get a refund for my flight?"
  - "Can you refund my flight?"
  - "I want my money back"

steps:

  - id: check_if_user_asked_explicitly_for_refund
    action: conditional_with_message
    condition: "user did not explicitly ask for a refund or compensation"
    message_on_true: "acknowledge the user's frustration and apologize for the inconvenience. say that you appreciate their feedback and will take it into consideration. DO NOT mention a refund or compensation at this time."

  - id: check_can_cancel_reservation
    action: conditional
    condition: "{can_cancel} = exists and false"
    then:
      steps:
        - id: inform_can_cancel_reservation
          action: reply
          message: "user is not eligible for cancellation or refund at this time. say to him that your a sorry, but you can't cancel your reservation and can't get a refund at this time."
    else:

  # Step 1: Get user ID and reservation ID
  - id: fetch_user_id
    action: fetch
    field: user_id
  
  - id: fetch_reservation_id
    action: fetch_with_condition
    field: reservation_id (which is a 6 letter code)
    condition: "assistant already asked explicitly for reservation id but user didn't provide it"
    then:
      steps:
        - id: find_reservation_subworkflow
          action: use_subworkflow
          subworkflow: FindReservationId

    
  
  # Step 2: Get user details to retrieve membership
  - id: get_user_details
    action: use_tool
    tool_name: get_user_details
    input: ["{{ user_id }}"]
    set_variables:
      - membership
  
  # Step 3: Get reservation details to get insurance and cabin
  - id: get_reservation_details_initial
    action: use_tool
    tool_name: get_reservation_details
    input: ["{{ reservation_id }}"]
    set_variables:
      - insurance
      - cabin
      - flights
      - passengers
  
  # Step 4: Check if refund is allowed based on membership, insurance, and cabin
  - id: check_refund_eligibility
    action: conditional
    condition: "{membership} = regular and {reservation_insurance} = no and {reservation_cabin} = economy"
    then:
      steps:
        - id: inform_refund_not_allowed
          action: reply
          message: "I'm sorry, but refunds are not allowed for regular members with economy cabin class and no travel insurance."
    else:
      steps:
        # Step 5: Fetch the complaint
        - id: fetch_complaint
          action: fetch_with_message
          field: complaint
          message: |
            Please describe your complaint or the reason for requesting a refund. Cancelled flights in the reservation, delayed flights and you want to change or cancel the reservation, or other issues.
        
        # Step 6: Check if complaint is about cancelled flights
        - id: check_cancelled_flight_complaint
          action: conditional
          condition: "{complaint} contains flight cancelled"
          then:
            steps:
              # Step 7: Extract flight numbers and dates from reservation
              - id: extract_flight_info_for_cancelled
                action: instruction
                instruction: |
                  Extract the flight numbers and dates from the reservation_flights.
                  The reservation_flights is a list of ReservationFlight objects, each containing:
                  - flight_number: The flight number (e.g., "HAT001")
                  - date: The flight date in YYYY-MM-DD format
                  
                  Set the following variables:
                  - flight_numbers: A list of all flight numbers from the reservation
                  - flight_dates: A list of all flight dates from the reservation
                set_variables:
                  - flight_numbers
                  - flight_dates
              
              # Step 8: Check if any flight was cancelled
              - id: check_flight_cancelled_status
                action: instruction
                instruction: |
                  For each flight in the reservation, check its status using get_flight_status tool.
                  
                  Steps:
                  1. Iterate through flight_numbers and flight_dates (they should have the same length)
                  2. For each pair (flight_number, date), call get_flight_status(flight_number, date)
                  3. Collect all flight statuses in a list called flight_statuses
                  4. Check if any flight status is "cancelled"
                  5. If at least one flight has status "cancelled", set has_cancelled_flight to true, else false
                  
                  Available tools:
                  - get_flight_status(flight_number: str, date: str) -> str
                  
                  The status can be: "available", "on time", "flying", "landed", "cancelled", or "delayed"
                tools_available:
                  - get_flight_status
                set_variables:
                  - flight_statuses
                  - has_cancelled_flight
              
              # Step 9: Verify cancelled flight and send certificate
              - id: verify_and_send_certificate_cancelled
                action: conditional
                condition: "{has_cancelled_flight} = true"
                then:
                  steps:
                    # Step 10: Calculate number of passengers
                    - id: get_number_of_passengers
                      action: instruction
                      instruction: |
                        Get the number of passengers from reservation_passengers.
                        reservation_passengers is a list of Passenger objects.
                        Set number_of_passengers to the length of this list.
                      set_variable: number_of_passengers
                    
                    # Step 11: Calculate certificate amount (100 * number of passengers)
                    - id: calculate_certificate_amount_cancelled
                      action: use_tool
                      tool_name: calculate
                      input: ["100 * {{ number_of_passengers }}"]
                      set_variable: certificate_amount
                    
                    # Step 12: Send certificate
                    - id: send_certificate_cancelled
                      action: use_tool
                      tool_name: send_certificate
                      input: ["{{ user_id }}", "{{ certificate_amount }}"]
                    
                    # Step 13: Confirm refund
                    - id: confirm_refund_cancelled
                      action: reply
                      message: |
                        I've verified that a flight in your reservation was cancelled. 
                        I've sent a certificate for {{ certificate_amount }} dollars (100 dollars per passenger) to your account.
                        The certificate has been added to your payment methods and can be used for future bookings.
                else:
                  steps:
                    - id: inform_no_cancelled_flight
                      action: reply
                      message: "I checked your reservation and did not find any cancelled flights. Please verify your complaint or contact customer service for further assistance."
          else:
            steps:
              # Step 14: Check if complaint is about delayed flights
              - id: check_delayed_flight_complaint
                action: conditional
                condition: "{complaint} contains delayed flight"
                then:
                  steps:
                    # Step 15: Check if user wants to change or cancel
                    - id: check_wants_change_or_cancel
                      action: fetch_with_message
                      field: wants_change_or_cancel
                      message: |
                        You mentioned a delayed flight. Would you like to change or cancel your reservation?
                        Please respond with 'change', 'cancel', or 'no'.
                    
                    # Step 16: Check if user wants change or cancel
                    - id: check_change_cancel_response
                      action: conditional
                      condition: "{wants_change_or_cancel} contains change or cancel"
                      then:
                        steps:
                          # Step 18: Check if any flight was delayed
                          - id: check_flight_delayed_status
                            action: instruction
                            instruction: |
                              For each flight in the reservation, check its status using get_flight_status tool.
                              
                              Steps:
                              1. Iterate through flight_numbers and flight_dates (they should have the same length)
                              2. For each pair (flight_number, date), call get_flight_status(flight_number, date)
                              3. Collect all flight statuses in a list called flight_statuses
                              4. Check if any flight status is "delayed"
                              5. If at least one flight has status "delayed", set has_delayed_flight to true, else false
                              
                              Available tools:
                              - get_flight_status(flight_number: str, date: str) -> str
                              
                              The status can be: "available", "on time", "flying", "landed", "cancelled", or "delayed"
                            tools_available:
                              - get_flight_status
                            set_variables:
                              - flight_statuses
                              - has_delayed_flight
                          
                          # Step 19: Verify delayed flight and send certificate
                          - id: verify_and_send_certificate_delayed
                            action: conditional
                            condition: "{has_delayed_flight} = true"
                            then:
                              steps:
                                # Step 20: Calculate number of passengers
                                - id: get_number_of_passengers_delayed
                                  action: instruction
                                  instruction: |
                                    Count the number of passengers from the passengers variable in memory.
                                    The passengers variable is a list of Passenger objects that was set from get_reservation_details.
                                    Set number_of_passengers to the length of this list.
                                  set_variable: number_of_passengers
                                
                                # Step 21: Calculate certificate amount (50 * number of passengers)
                                - id: calculate_certificate_amount_delayed
                                  action: use_tool
                                  tool_name: calculate
                                  input: ["50 * {{ number_of_passengers }}"]
                                  set_variable: certificate_amount
                                
                                # Step 22: Send certificate
                                - id: send_certificate_delayed
                                  action: use_tool
                                  tool_name: send_certificate
                                  input: ["{{ user_id }}", "{{ certificate_amount }}"]
                                
                                # Step 23: Confirm refund
                                - id: confirm_refund_delayed
                                  action: reply
                                  message: |
                                    I've verified that a flight in your reservation was delayed and you want to {{ wants_change_or_cancel }} your reservation.
                                    I've sent a certificate for {{ certificate_amount }} dollars (50 dollars per passenger) to your account.
                                    The certificate has been added to your payment methods and can be used for future bookings.
                            else:
                              steps:
                                - id: inform_no_delayed_flight
                                  action: reply
                                  message: "I checked your reservation and did not find any delayed flights. Please verify your complaint or contact customer service for further assistance."
                      else:
                        steps:
                          - id: inform_no_change_cancel
                            action: reply
                            message: "Since you don't want to change or cancel your reservation, I cannot process a refund for delayed flights. If you change your mind, please let me know."
                else:
                  steps:
                    - id: inform_other_complaint
                      action: reply
                      message: |
                        I understand your complaint. However, refunds are only available for:
                        - Cancelled flights in the reservation
                        - Delayed flights when you want to change or cancel your reservation
                        
                        For other issues, please contact customer service for assistance.


