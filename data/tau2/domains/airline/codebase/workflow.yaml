# Existing workflow
workflow: BookFlight
when: "user wants to book a flight reservation or to find available flights"

keywords:
  - book flight
  - flight reservation
  - find flights
  - available flights
  - flight booking

examples:
  - "I want to book a flight"
  - "Can you help me find available flights?"
  - "I need to make a flight reservation"
  - "Show me flights from New York to London"

steps:
  # Step 1: Get user ID
  - id: fetch_user_id
    action: fetch
    field: user_id
  
  # Step 2: Get trip details
  - id: fetch_trip_details
    action: fetch
    fields:
      - trip_type
      - origin
      - destination
  
  # Step 3: Get date
  - id: fetch_date
    action: fetch
    field: date
  
  # Step 4: Get cabin class
  - id: fetch_cabin
    action: fetch
    field: cabin
  
  # Step 5: Get number of passengers
  - id: fetch_number_of_passengers
    action: fetch_with_condition
    field: number_of_passengers
    condition: "{number_of_passengers} <= 5"
    then:
      steps:
        # Step 6: Ask about flight preference
        - id: fetch_flight_preference
          action: fetch_with_condition
          field: flight_preference
          condition: "{flight_preference} = direct only"
          then:
            steps:
              # Search direct flights only
              - id: search_direct_flights
                action: use_tool
                tool_name: search_direct_flight
                input: ["{{ origin }}", "{{ destination }}", "{{ date }}"]
                filter:
                  - field: available_seats.{{ cabin }}
                    operator: gte
                    value: "{{ number_of_passengers }}"
          else:
            steps:
              - id: check_one_stop_only
                action: conditional
                condition: "{flight_preference} contains one stop only"
                then:
                  steps:
                    # Search one-stop flights only
                    - id: search_onestop_flights
                      action: use_tool
                      tool_name: search_onestop_flight
                      input: ["{{ origin }}", "{{ destination }}", "{{ date }}"]
                      filter:
                        - field: available_seats.{{ cabin }}
                          operator: gte
                          value: "{{ number_of_passengers }}"
                else:
                  # Search both direct and one-stop flights
                  steps:
                    - id: search_direct_flights
                      action: use_tool
                      tool_name: search_direct_flight
                      input: ["{{ origin }}", "{{ destination }}", "{{ date }}"]
                      filter:
                        - field: available_seats.{{ cabin }}
                          operator: gte
                          value: "{{ number_of_passengers }}"
                    - id: search_onestop_flights
                      action: use_tool
                      tool_name: search_onestop_flight
                      input: ["{{ origin }}", "{{ destination }}", "{{ date }}"]
                      filter:
                        - field: available_seats.{{ cabin }}
                          operator: gte
                          value: "{{ number_of_passengers }}"
        
        # Step 8: Display flight results
        - id: display_flight_results
          action: conditional
          condition: "{flight_preference} = direct only"
          then:
            id: display_flight_results_direct
            action: fetch_with_message
            field: selected_flights
            message: |
              Here are the available direct flights for your trip:
              
              {{ search_direct_flight_result }}
              
              Please select which flight you'd like to book by providing the flight ID.
          else:
            steps:
              - id: check_display_one_stop
                action: conditional
                condition: "{flight_preference} = one stop only"
                then:
                  id: check_display_one_stop_true
                  action: fetch_with_message
                  field: selected_flights
                  message: |
                    Here are the available one-stop flights for your trip:
                    
                    {{ search_onestop_flight_result }}
                    
                    Please select which flight you'd like to book by providing the flight ID.
                else:
                  id: check_display_one_stop_false
                  action: fetch_with_message
                  field: selected_flights
                  message: |
                    Here are the available flights for your trip:
                    
                    Direct flights:
                    {{ search_direct_flight_result }}
                    
                    One-stop flights:
                    {{ search_onestop_flight_result }}
                    
                    Please select which flight you'd like to book by providing the flight ID.
        
        # Step 10: Collect passenger information
        - id: ask_about_travel_insurance
          action: fetch_with_message
          field: interested_in_travel_insurance
          message: |
            Do you want to purchase travel insurance for your trip? The travel insurance is 30 dollars per passenger and enables full refund if the user needs to cancel the flight given health or weather reasons.
        
        - id: collect_all_passengers_details
          action: fetch_with_condition
          fields: passengers_details (first_name, last_name, date_of_birth)
          condition: "{passengers_details} = complete information for all {number_of_passengers} travelers, each with first_name, last_name, and date_of_birth"

        - id: collect_payment_methods
          action: use_tool
          tool_name: get_user_details
          input: ["{{ user_id }}"]
          filter:
            - field: count_travel_certificates
              operator: less_equal
              value: 1
            - field: count_credit_cards
              operator: less_equal
              value: 1
            - field: count_gift_cards
              operator: less_equal
              value: 3
        

        - id: get_explicit_confirmation
          action: fetch
          field: explicit_confirmation
          condition: "{explicit_confirmation} = yes"
          then:
            steps:
              - id: book_reservation
                action: use_tool
                tool_name: book_reservation
                input: ["{{ user_id }}", "{{ origin }}", "{{ destination }}", "{{ flight_type }}", "{{ cabin }}", "{{ flights }}", "{{ passengers_details }}", "{{ payment_methods }}", "{{ total_baggages }}", "{{ nonfree_baggages }}", "{{ travel_insurance }}"]
                set_variables:
                  - reservation_id
              
              - id: display_reservation_confirmation
                action: fetch_with_message
                field: reservation_id
                message: |
                  Your reservation has been confirmed. Your reservation ID is {{ reservation_id }}.
    else:
      steps:
        - id: inform_max_passengers
          action: reply
          message: "Each reservation can have at most five passengers. "


---
subworkflow: GivingCheckedBagInformation
when: "user asks about checked bag allowance or baggage information"

steps:
  # Step 1: Get user ID (if not already available)
  - id: fetch_user_id
    action: fetch
    field: user_id
  
  # Step 2: Get cabin class
  - id: fetch_cabin
    action: fetch
    field: cabin
  
  # Step 3: Get user details to retrieve membership status
  - id: get_user_details
    action: use_tool
    tool_name: get_user_details
    input: ["{{ user_id }}"]
  
  # Step 4: Fetch membership status (extracted from user details or fetched directly)
  - id: fetch_membership
    action: fetch
    field: membership
  
  # Step 5: Calculate free checked bags based on membership and cabin
  - id: calculate_free_bags
    action: conditional
    condition: "{membership} = regular"
    then:
      steps:
        - id: check_regular_cabin
          action: conditional
          condition: "{cabin} = basic_economy"
          then:
            steps:
              - id: set_free_bags
                action: set_variable
                variable: free_checked_bags_per_passenger
                value: 0
          else:
            steps:
              - id: check_regular_economy
                action: conditional
                condition: "{cabin} = economy"
                then:
                  steps:
                    - id: set_free_bags
                      action: set_variable
                      variable: free_checked_bags_per_passenger
                      value: 1
                else:
                  steps:
                    - id: set_free_bags
                      action: set_variable
                      variable: free_checked_bags_per_passenger
                      value: 2
    else:
      steps:
        - id: check_silver
          action: conditional
          condition: "{membership} = silver"
          then:
            steps:
              - id: check_silver_cabin
                action: conditional
                condition: "{cabin} = basic_economy"
                then:
                  steps:
                    - id: set_free_bags
                      action: set_variable
                      variable: free_checked_bags_per_passenger
                      value: 1
                else:
                  steps:
                    - id: check_silver_economy
                      action: conditional
                      condition: "{cabin} = economy"
                      then:
                        steps:
                          - id: set_free_bags
                            action: set_variable
                            variable: free_checked_bags_per_passenger
                            value: 2
                      else:
                        steps:
                          - id: set_free_bags
                            action: set_variable
                            variable: free_checked_bags_per_passenger
                            value: 3
          else:
            # Must be gold member
            steps:
              - id: check_gold_cabin
                action: conditional
                condition: "{cabin} = basic_economy"
                then:
                  steps:
                    - id: set_free_bags
                      action: set_variable
                      variable: free_checked_bags_per_passenger
                      value: 2
                else:
                  steps:
                    - id: check_gold_economy
                      action: conditional
                      condition: "{cabin} = economy"
                      then:
                        steps:
                          - id: set_free_bags
                            action: set_variable
                            variable: free_checked_bags_per_passenger
                            value: 3
                      else:
                        steps:
                          - id: set_free_bags
                            action: set_variable
                            variable: free_checked_bags_per_passenger
                            value: 3
  
  

---
subworkflow: ModifyBaggage
when: "user wants to modify or change checked baggage for their reservation"

keywords:
  - modify baggage
  - change baggage
  - add baggage
  - remove baggage
  - update bags
  - checked bags
  - baggage modification

examples:
  - "I want to add checked bags"
  - "Can I remove a checked bag?"
  - "I need to modify my baggage"
  - "I want to change my checked bags"

steps:
  # Step 1: Get user ID and determine action (add or remove)
  - id: fetch_user_id_and_baggage_action
    action: fetch
    fields:
      - user_id
      - baggage_action
  
  # Step 2: Check if user wants to remove (not allowed)
  - id: check_remove_action
    action: conditional
    condition: "{baggage_action} = remove"
    then:
      steps:
        - id: inform_remove_not_possible
          action: reply
          message: "I'm sorry, but it's not possible to remove checked bags from an existing reservation. You can only add additional checked bags."
    else:
      steps:
        # Step 3: Fetch reservation ID
        - id: fetch_reservation_id
          action: fetch
          field: reservation_id
        
        # Step 4: Get reservation details (uses reservation_id)
        - id: get_reservation_details
          action: use_tool
          tool_name: get_reservation_details
          input: ["{{ reservation_id }}"]
          set_variables:
            - total_baggages
            - nonfree_baggages
            - cabin
            - passengers
        
        # Step 5: Get user details to retrieve membership status (uses user_id)
        - id: get_user_details
          action: use_tool
          tool_name: get_user_details
          input: ["{{ user_id }}"]
          set_variables:
            - membership

        # Step 6: Calculate free checked bags based on membership and cabin (uses user_id, cabin, membership)
        - id: calculate_free_bags
          action: use_subworkflow
          subworkflow: GivingCheckedBagInformation
        
        # Step 9: Fetch number of passengers
        - id: fetch_number_of_passengers
          action: fetch
          field: number_of_passengers
        
        # Step 10: Calculate total free bags for all passengers
        - id: calculate_total_free_bags
          action: use_tool
          tool_name: calculate
          input: ["{{ free_checked_bags_per_passenger }} * {{ number_of_passengers }}"]
        
        # Step 11: Fetch desired total baggages
        - id: fetch_desired_total_baggages
          action: fetch
          field: desired_total_baggages
        
        # Step 12: Calculate total baggages minus free bags
        - id: calculate_baggages_minus_free
          action: use_tool
          tool_name: calculate
          input: ["{{ desired_total_baggages }} - {{ calculate_total_free_bags_result }}"]
        
        # Step 13: Determine new nonfree baggages (max of 0 or calculated value)
        - id: determine_new_nonfree_baggages
          action: conditional
          condition: "{calculate_baggages_minus_free_result} >= 0"
          then:
            steps:
              - id: set_new_nonfree_baggages
                action: set_variable
                variable: new_nonfree_baggages
                value: "{{ calculate_baggages_minus_free_result }}"
          else:
            steps:
              - id: set_new_nonfree_baggages_zero
                action: set_variable
                variable: new_nonfree_baggages
                value: 0
        
        # Step 14: Calculate price difference
        - id: calculate_price_difference
          action: use_tool
          tool_name: calculate
          input: ["50 * ({{ new_nonfree_baggages }} - {{ nonfree_baggages }})"]
          set_variable:
            - price_difference
        
        # Step 15: Ask for confirmation
        - id: inform_price_difference_and_confirm
          action: fetch_with_message
          field: change_confirmed
          message: |
            For changing your baggage from {{ nonfree_baggages }} non-free bags to {{ new_nonfree_baggages }} non-free bags (total {{ desired_total_baggages }} bags), the price difference is {{ price_difference }} dollars. You will need to pay this additional amount.
            
            Please confirm the change by typing 'yes' or 'no'.
        
        # Step 16: Check confirmation
        - id: check_change_confirmed
          action: conditional
          condition: "{change_confirmed} = yes"
          then:
            steps:
              # Step 17: Fetch payment_id from user
              - id: fetch_payment_id
                action: use_tool
                tool_name: get_user_details
                input: ["{{ user_id }}"]
                set_variables:
                  - payment_id
              
              # Step 18: Update reservation baggages
              - id: update_reservation_baggages
                action: use_tool
                tool_name: update_reservation_baggages
                input: ["{{ reservation_id }}", "{{ desired_total_baggages }}", "{{ new_nonfree_baggages }}", "{{ payment_id }}"]
              
              - id: confirm_baggage_updated
                action: reply
                message: "Your baggage has been successfully updated."
          else:
            steps:
              - id: inform_change_cancelled
                action: reply
                message: "The baggage change has been cancelled. Your reservation remains unchanged."

---
subworkflow: ModifyCabin
when: "user wants to change the cabin class of their flight reservation"

steps:
  - id: fetch_requested_cabin
    action: fetch
    field: requested_cabin
  
  - id: check_flight_type_and_search
    action: conditional
    condition: "{current_flight_type} = direct"
    then:
      steps:
        - id: search_new_cabin_price_direct
          action: use_tool
          tool_name: search_direct_flight
          input: ["{{ origin }}", "{{ destination }}", "{{ date }}"]
          set_variables:
            - requested_cabin_price

    else:
      steps:
        - id: search_new_cabin_price_onestop
          action: use_tool
          tool_name: search_onestop_flight
          input: ["{{ current_origin }}", "{{ current_destination }}", "{{ current_date }}"]
          set_variables:
            - requested_cabin_price

            
  
  - id: check_price_and_calculate_difference
    action: conditional
    condition: "{requested_cabin_price} > {current_flight_price}"
    then:
      steps:
        - id: calculate_price_difference_higher
          action: conditional
          condition: "{current_flight_type} = direct"
          then:
            steps:
              - id: calculate_direct_price_diff_higher
                action: use_tool
                tool_name: calculate
                input: ["{{ requested_cabin_price }} - {{ current_flight_price }}"]
                set_variable:
                  - price_difference
          else:
            steps:
              - id: calculate_onestop_price_diff_higher
                action: use_tool
                tool_name: calculate
                input: ["{{ requested_cabin_price }} - {{ current_flight_price }}"]
                set_variable:
                  - price_difference
        
        - id: inform_price_difference_higher
          action: fetch_with_message
          field: change_confirmed
          message: |
            For changing from cabin {{ current_cabin }} to {{ requested_cabin }}, for flight from {{ current_origin }} to {{ current_destination }} on {{ current_date }}, the price difference is {{ price_difference }}. You will need to add this amount. Please confirm the change by typing 'yes' or 'no'.
    else:
      steps:
        - id: calculate_price_difference_lower
          action: conditional
          condition: "{current_flight_type} = direct"
          then:
            steps:
              - id: calculate_direct_price_diff_lower
                action: use_tool
                tool_name: calculate
                input: ["{{ current_flight_price }} - {{ requested_cabin_price }}"]
                set_variable:
                  - price_difference
          else:
            steps:
              - id: calculate_onestop_price_diff_lower
                action: use_tool
                tool_name: calculate
                input: ["{{ current_flight_price }} - {{ requested_cabin_price }}"]
                set_variable:
                  - price_difference
        
        - id: inform_price_difference_lower
          action: fetch_with_message
          field: change_confirmed
          message: |
            For changing from cabin {{ current_cabin }} to {{ requested_cabin }}, for flight from {{ current_origin }} to {{ current_destination }} on {{ current_date }}, the price difference is {{ price_difference }}. You will be refunded this amount. Please confirm the change by typing 'yes' or 'no'.

  - id: check_change_confirmed
    action: conditional
    condition: "{change_confirmed} = yes"
    then:
      steps:
        - id: fetch_payment_id
          action: use_tool
          tool_name: get_user_details
          input: ["{{ user_id }}"]
          set_variables:
            - payment_id
        
        - id: update_reservation_cabin
          action: use_tool
          tool_name: update_reservation_flights
          input: ["{{ reservation_id }}", "{{ requested_cabin }}", "{{ current_flights }}", "{{ payment_id }}"]

  
---
  workflow: ModifyFlightReservation
  when: "user wants to modify or change their flight reservation"

  keywords:
    - modify flight reservation
    - change flight reservation
    - modify flight
    - change flight
    - flight modification
    - flight change

  steps:
    # Step 1: Get user ID and reservation ID
    - id: fetch_user_and_reservation
      action: fetch
      fields:
        - user_id
        - reservation_id
    
    # Step 2: Get reservation details to get current cabin and flight info
    - id: get_reservation_details
      action: use_tool
      tool_name: get_reservation_details
      input: ["{{ reservation_id }}"]
      set_variables:
        - current_cabin
        - current_flights
        - current_price
        - current_flight_type
        - current_origin
        - current_destination
        - current_date
        - current_number_of_passengers
        - current_total_baggages
        - current_nonfree_baggages

    # Step 3: Check if basic economy (cannot be modified)
    - id: check_basic_economy
      action: conditional
      condition: "{current_cabin} = basic_economy"
      then:
        steps:
          - id: inform_basic_economy_not_allowed
            action: reply
            message: "I'm sorry, but basic economy flights cannot be modified."
      else:
        steps:
          - id: fetch_requested_change
            action: fetch_with_message
            field: requested_change_type
            message: |
              What would you like to change about your flight reservation?
              Please select one of the following options:
              - Cabin class
              - Flight dates
              - Baggage
              - Passengers details
          
          # Step 4: Handle different change types using nested conditionals
          - id: handle_requested_change
            action: conditional
            condition: "{requested_change_type} = cabin"
            then:
              steps:
                - id: call_modify_cabin
                  action: use_subworkflow
                  subworkflow: ModifyCabin
            else:
              steps:
                - id: check_baggage_change
                  action: conditional
                  condition: "{requested_change_type} = baggage"
                  then:
                    steps:
                      - id: call_modify_baggage
                        action: use_subworkflow
                        subworkflow: ModifyBaggage
                  else:
                    steps:
                      - id: check_passengers_details_change
                        action: conditional
                        condition: "{requested_change_type} = passengers details"
                        then:
                          steps:
                            - id: call_modify_passengers_details
                              action: use_subworkflow
                              subworkflow: ModifyPassengersDetails
                        else:
                          steps:
                            - id: check_flight_dates_change
                              action: conditional
                              condition: "{requested_change_type} = flight dates"
                              then:
                                steps:
                                  - id: call_modify_dates
                                    action: use_subworkflow
                                    subworkflow: ModifyDates
                              else:
                                steps:
                                  - id: handle_other_change_types
                                    action: reply
                                    message: "This change type is not yet supported. Please contact customer service for assistance with {{ requested_change_type }} changes."


---
subworkflow: ModifyDates
when: "user wants to change the flight dates of their reservation"

steps:
  # Step 1: Get requested dates
  - id: fetch_requested_dates
    action: fetch
    field: requested_dates
  
  # Step 2: Check flight type and search for available flights on new dates
  - id: check_flight_type_and_search
    action: conditional
    condition: "{current_flight_type} = direct"
    then:
      steps:
        # Search direct flights for new dates
        - id: search_direct_flights_new_dates
          action: use_tool
          tool_name: search_direct_flight
          input: ["{{ current_origin }}", "{{ current_destination }}", "{{ requested_dates }}"]
          filter:
            - field: available_seats.{{ current_cabin }}
              operator: gte
              value: "{{ current_number_of_passengers }}"
    else:
      steps:
        # Search one-stop flights for new dates
        - id: search_onestop_flights_new_dates
          action: use_tool
          tool_name: search_onestop_flight
          input: ["{{ current_origin }}", "{{ current_destination }}", "{{ requested_dates }}"]
          filter:
            - field: available_seats.{{ current_cabin }}
              operator: gte
              value: "{{ current_number_of_passengers }}"
  
  # Step 3: Check if any flights were found and handle accordingly
  - id: check_flights_found
    action: conditional
    condition: "{current_flight_type} = direct"
    then:
      steps:
        # For direct flights, check if results are empty
        - id: check_direct_flights_empty
          action: fetch_with_message
          field: has_flights
          message: |
            I searched for direct flights from {{ current_origin }} to {{ current_destination }} on {{ requested_dates }}.
            
            Search results: {{ search_direct_flight_result }}
            
            Are there any available flights in the results above? Please respond with 'yes' if flights are available, or 'no' if the results are empty.
        
        - id: handle_direct_flights_response
          action: conditional
          condition: "{has_flights} = no"
          then:
            steps:
              # No flights found - ask if user wants other dates
              - id: ask_other_dates_direct
                action: fetch_with_message
                field: want_other_dates
                message: |
                  I'm sorry, but there are no available direct flights from {{ current_origin }} to {{ current_destination }} on {{ requested_dates }} for {{ current_cabin }} cabin with {{ current_number_of_passengers }} passenger(s).
                  
                  Would you like to search for other dates? Please respond with 'yes' or 'no'.
              
              - id: handle_other_dates_direct
                action: conditional
                condition: "{want_other_dates} = yes"
                then:
                  steps:
                    - id: fetch_new_dates_direct
                      action: fetch
                      field: requested_dates
                      # Note: In a real implementation, this would loop back, but workflows don't support loops
                      # The user would need to restart the modification process
                else:
                  steps:
                    - id: inform_cannot_proceed_direct
                      action: reply
                      message: "I understand. If you'd like to change your flight dates in the future, please let me know."
          else:
            steps:
              # Flights found - display and get selection
              - id: display_direct_flights_and_select
                action: fetch_with_message
                field: selected_flights
                message: |
                  Here are the available direct flights for your trip on {{ requested_dates }}:
                  
                  {{ search_direct_flight_result }}
                  
                  Please select which flight you'd like to change to by providing the flight ID.
    else:
      steps:
        # For one-stop flights, check if results are empty
        - id: check_onestop_flights_empty
          action: fetch_with_message
          field: has_flights
          message: |
            I searched for one-stop flights from {{ current_origin }} to {{ current_destination }} on {{ requested_dates }}.
            
            Search results: {{ search_onestop_flight_result }}
            
            Are there any available flights in the results above? Please respond with 'yes' if flights are available, or 'no' if the results are empty.
        
        - id: handle_onestop_flights_response
          action: conditional
          condition: "{has_flights} = no"
          then:
            steps:
              # No flights found - ask if user wants other dates
              - id: ask_other_dates_onestop
                action: fetch_with_message
                field: want_other_dates
                message: |
                  I'm sorry, but there are no available one-stop flights from {{ current_origin }} to {{ current_destination }} on {{ requested_dates }} for {{ current_cabin }} cabin with {{ current_number_of_passengers }} passenger(s).
                  
                  Would you like to search for other dates? Please respond with 'yes' or 'no'.
              
              - id: handle_other_dates_onestop
                action: conditional
                condition: "{want_other_dates} = yes"
                then:
                  steps:
                    - id: fetch_new_dates_onestop
                      action: fetch
                      field: requested_dates
                      # Note: In a real implementation, this would loop back, but workflows don't support loops
                else:
                  steps:
                    - id: inform_cannot_proceed_onestop
                      action: reply
                      message: "I understand. If you'd like to change your flight dates in the future, please let me know."
          else:
            steps:
              # Flights found - display and get selection
              - id: display_onestop_flights_and_select
                action: fetch_with_message
                field: selected_flights
                message: |
                  Here are the available one-stop flights for your trip on {{ requested_dates }}:
                  
                  {{ search_onestop_flight_result }}
                  
                  Please select which flight you'd like to change to by providing the flight ID.
  
  # Step 4: Calculate price for selected flight(s) and compare with current price
  - id: calculate_new_flight_price
    action: conditional
    condition: "{current_flight_type} = direct"
    then:
      steps:
        - id: extract_direct_flight_price
          action: use_tool
          tool_name: calculate
          input: ["{{ selected_flight_price_per_passenger }} * {{ current_number_of_passengers }}"]
          set_variable:
            - new_flight_price
    else:
      steps:
        - id: extract_onestop_flight_price
          action: use_tool
          tool_name: calculate
          input: ["{{ selected_flight_price_per_passenger }} * {{ current_number_of_passengers }}"]
          set_variable:
            - new_flight_price
  
  # Step 5: Compare prices and calculate difference
  - id: check_price_and_calculate_difference
    action: conditional
    condition: "{new_flight_price} > {current_flight_price}"
    then:
      steps:
        - id: calculate_price_difference_higher
          action: use_tool
          tool_name: calculate
          input: ["{{ new_flight_price }} - {{ current_flight_price }}"]
          set_variable:
            - price_difference
        
        - id: inform_price_difference_higher
          action: fetch_with_message
          field: change_confirmed
          message: |
            For changing your flight from {{ current_origin }} to {{ current_destination }} from {{ current_date }} to {{ requested_dates }}, the price difference is {{ price_difference }} dollars. You will need to pay this additional amount.
            
            Please confirm the change by typing 'yes' or 'no'.
    else:
      steps:
        - id: calculate_price_difference_lower
          action: use_tool
          tool_name: calculate
          input: ["{{ current_flight_price }} - {{ new_flight_price }}"]
          set_variable:
            - price_difference
        
        - id: inform_price_difference_lower
          action: fetch_with_message
          field: change_confirmed
          message: |
            For changing your flight from {{ current_origin }} to {{ current_destination }} from {{ current_date }} to {{ requested_dates }}, the price difference is {{ price_difference }} dollars. You will be refunded this amount.
            
            Please confirm the change by typing 'yes' or 'no'.
  
  # Step 6: Check confirmation and update reservation
  - id: check_change_confirmed
    action: conditional
    condition: "{change_confirmed} = yes"
    then:
      steps:
        - id: fetch_payment_id
          action: use_tool
          tool_name: get_user_details
          input: ["{{ user_id }}"]
          set_variables:
            - payment_id
        
        - id: update_reservation_flights
          action: use_tool
          tool_name: update_reservation_flights
          input: ["{{ reservation_id }}", "{{ current_cabin }}", "{{ selected_flights }}", "{{ payment_id }}"]
        
        - id: confirm_reservation_updated
          action: reply
          message: "Your flight dates have been successfully updated. Your reservation has been modified to the new dates."
    else:
      steps:
        - id: inform_change_cancelled
          action: reply
          message: "The flight date change has been cancelled. Your reservation remains unchanged."

  
subworkflow: ModifyPassengersDetails
when: "user wants to change passenger details in their reservation"

steps:
  # Step 1: Determine what the user wants to change
  - id: fetch_change_type
    action: fetch_with_message
    field: passenger_change_type
    message: |
      What would you like to change about the passengers?
      - Passenger details (names, date of birth)
      - Number of passengers
      
      Please specify which one.
  
  # Step 2: Check if they want to change number of passengers (not allowed)
  - id: check_number_of_passengers_change
    action: conditional
    condition:
      operator: eq
      left: "{{ passenger_change_type }}"
      right: "number of passengers"
    then:
      steps:
        - id: inform_number_change_not_allowed
          action: reply
          message: "I'm sorry, but the number of passengers cannot be modified after booking. You can only update passenger details (names and date of birth) for the existing {{ current_number_of_passengers }} passenger(s)."
    else:
      steps:
        # Step 3: Collect updated passenger details
        - id: collect_updated_passengers_details
          action: fetch_with_condition
          fields: updated_passengers_details (first_name, last_name, date_of_birth)
          condition:
            operator: eq
            left: "{{ updated_passengers_details }}"
            right: "complete information for all {{ current_number_of_passengers }} travelers, each with first_name, last_name, and date_of_birth"
        
        # Step 4: Ask for confirmation
        - id: confirm_passenger_details_change
          action: fetch_with_message
          field: change_confirmed
          message: |
            You are updating the passenger details for {{ current_number_of_passengers }} passenger(s) in your reservation.
            
            Updated passenger details:
            {{ updated_passengers_details }}
            
            Please confirm this change by typing 'yes' or 'no'.
        
        # Step 5: Check confirmation and update
        - id: check_change_confirmed
          action: conditional
          condition:
            operator: eq
            left: "{{ change_confirmed }}"
            right: "yes"
          then:
            steps:
              - id: update_reservation_passengers
                action: use_tool
                tool_name: update_reservation_passengers
                input: ["{{ reservation_id }}", "{{ updated_passengers_details }}"]
              
              - id: confirm_passengers_updated
                action: reply
                message: "The passenger details have been successfully updated for your reservation."
          else:
            steps:
              - id: inform_change_cancelled
                action: reply
                message: "The passenger details change has been cancelled. Your reservation remains unchanged."

