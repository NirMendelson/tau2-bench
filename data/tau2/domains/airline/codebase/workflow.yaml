- workflow: BookFlight
  when: "user wants to book a flight reservation or to find available flights"
  keywords:
  - book flight
  - flight reservation
  - find flights
  - available flights
  - flight booking

  examples:
  - "I want to book a flight"
  - "Can you help me find available flights?"
  - "I need to make a flight reservation"
  - "Show me flights from New York to London"

- id: check_existing_flight
  action: conditional
  condition: '{user_wants_same__as_previous_flight} = yes'
  then:
  - id: find_reservation_id
    action: use_function
    function: FindReservationId

  - id: get_reservation_details
    action: use_tool
    tool_name: get_reservation_details
    input: ['{{ reservation_id }}']
    set_variable: [cabin, flights]

  - id: check_flight_connections
    action: conditional
    condition: '{number_of_flights} = 2'
    then:
    - id: set_direct_flight_preference
      action: set_variable
      variable: flight_preference
      value: direct

    else:
    - id: check_one_stop_connection
      action: conditional
      condition: '{number_of_flights} = 4'
      then:
      - id: set_one_stop_flight_preference
        action: set_variable
        variable: flight_preference
        value: one stop

- id: fetch_user_id
  action: fetch
  field: user_id

  # Step 2: Get trip details
- id: fetch_trip_details
  action: fetch
  field: [flight_type, origin, destination]
  comment: origin and destination have to be 3 letter airport codes.

- id: fetch_date
  action: fetch
  field: date
  comment: date must be in the format YYYY-MM-DD

  # Step 4: Get cabin class
- id: fetch_cabin
  action: fetch
  field: cabin

  # Step 5: Get number of passengers
- id: fetch_number_of_passengers
  action: fetch_with_condition
  field: number_of_passengers
  condition: "{number_of_passengers} <= 5"
  then:
  - id: find_flights_function
    action: use_function
    function: FindAvailableFlights
    set_variable: possible_flights

  - id: display_flight_options
    action: fetch
    field: selected_flights
    comment: show the user possible_flights and ask what flights does it want to book. if the user want to filter the possible_flights so filter it only to the flights that match the user's preferences.

    # Step 10: Collect passenger information
  - id: ask_about_travel_insurance
    action: fetch_with_message
    field: interested_in_travel_insurance
    message: |
      Do you want to purchase travel insurance for your trip? The travel insurance is 30 dollars per passenger and enables full refund if the user needs to cancel the flight given health or weather reasons.

  - id: get_saved_passengers
    action: use_tool
    tool_name: get_user_details
    input: ['{{ user_id }}']
    comment: get saved passengers, and if the main user is not in the list, add 
      it to the list, based on the user name and dob
    set_variable: possible_but_not_confirmed_passengers

  - id: collect_all_passengers_details
    action: fetch_with_condition
    field: passengers_details (first_name, last_name, date_of_birth)
    condition: '{passengers_details} = complete information for all {number_of_passengers}
      travelers, each with first_name, last_name, and date_of_birth'
    comment: |
      Date of birth must be a date in the format YYYY-MM-DD, if user ask 
      you to take pieces of information from the data, you can use 
      possible_but_not_confirmed_passengers. the format should be [first_name: first name, last_name: last name, date_of_birth: date of birth]

  - id: ask_preferred_payment_method
    action: fetch_with_message
    field: preferred_payment_method
    message: What is your preferred payment method? You can pay with either 1 
      certificate, 1 credit card, or up to 3 gift cards.
    comment: valid options are 'certificate', 'credit_card', 'gift_card', if the user mention it want to split between a few, or use a specific certicicate, card, gift_card, include it in the field.

  - id: collect_payment_methods
    action: use_tool
    tool_name: get_user_details
    input: ["{{ user_id }}"]
    comment: get the details of the preferred payment method
    set_variable: user_optional_payment_methods

  - id: fetch_wanted_checked_bags_per_passenger
    action: fetch
    field: wanted_checked_bags_per_passenger
    comment: have to be a number

  - id: get_allowed_checked_bags
    action: use_function
    function: GivingCheckedBagInformation
    set_variable: allowed_checked_bags_per_passenger

  - id: calculate_nonfree_bags_per_passenger
    action: conditional
    condition: "{wanted_checked_bags_per_passenger} <= {allowed_checked_bags_per_passenger}"
    then:
    - id: set_nonfree_bags_zero
      action: set_variable
      variable: nonfree_bags_per_passenger
      value: 0
    else:
    - id: calculate_nonfree_bags_difference
      action: use_tool
      tool_name: calculate
      input: ["{{ wanted_checked_bags_per_passenger }} - {{ allowed_checked_bags_per_passenger }}"]
      set_variable: nonfree_bags_per_passenger

  - id: calculate_total_price
    action: instruction
    instruction: |
      you need to calculate the total price the user needs to pay for the reservation.
      1. find what cabin the user wants to book.
      2. sum the price of each flight in flight results BY CABIN.
      3. multiple the price by number of passengers

      Return the total price.
    set_variable: total_price

  - id: get_explicit_confirmation
    action: fetch
    field: explicit_reservation_confirmation
    comment: we have to make sure we have a explicit confirmation from the user 
      on all of the reservation details. if there is no, ask for it. write the 
      flight details including- origin, destination, date, flight type, cabin, 
      flights, passengers_details, payment_methods, total_baggages, 
      travel_insurance, price

  - id: book_reservation
    action: use_tool
    smart_tool: true
    tool_name: book_reservation
    input: ["{{ user_id }}", "{{ origin }}", "{{ destination }}", "{{ flight_type
        }}", "{{ cabin }}", "{{ selected_flights }}", "{{ passengers_details }}",
      "{{ preferred_payment_method_details }}", "{{ total_baggages }}", "{{ nonfree_baggages
        }}", "{{ travel_insurance }}", "{{ total_price }}"]
    comment: |
      Payment splitting instructions:
      1. You can split payment across multiple payment methods with these limits:
         - Maximum 1 travel certificate
         - Maximum 1 credit card  
         - Maximum 3 gift cards
      2. For each payment method in the payment_methods array, set the 'amount' field to the exact dollar amount you want to charge to that specific payment method.
      3. The sum of all 'amount' values across all payment methods MUST equal the total_price exactly.
      4. Example: If total_price is $500, you could split it as:
         - Payment method 1 (credit card): amount = 300
         - Payment method 2 (gift card): amount = 200
         Total: 300 + 200 = 500 ✓
      5. For gift cards and certificates, ensure the amount does not exceed the available balance.
    set_variable: [new_reservation_id: reservation_id]

  - id: display_reservation_confirmation
    action: reply
    message: |
      Your reservation has been confirmed. Your reservation ID is {{ new_reservation_id }}.
  else:
  - id: inform_max_passengers
    action: reply
    message: "Each reservation can have at most five passengers. "



  
---
- workflow: ModifyFlightReservation
  when: "user wants to modify or change the flights in their reservation, it only
    relevant for flights, not for changing other details in the reservation"

  examples:
  - "I want to change the flights in my reservation"
  - "Can I modify the flights in my reservation?"
  - "I need to update the flights in my reservation"
  - "How can I change the flights in my reservation?"
  keywords:
  - modify flight reservation
  - change flight reservation
  - modify flight
  - change flight
  - flight modification
  - flight change

- id: fetch_user_id
  action: fetch
  field: user_id
  comment: "the only correct term is user id."

- id: fetch_reservation_id
  action: fetch_with_condition
  field: reservation_id
  condition: "assistant already asked explicitly for {reservation_id} but user didn't
    provide it. reservation id is completly different from user id."
  then:
  - id: find_reservation_function
    action: use_function
    function: FindReservationId

    # Step 2: Get reservation details to get current cabin and flight info


---
- workflow: ModifyPassengersDetails
  when: "user wants to change passenger details or passenger count in their reservation"
  examples:
  - "I want to change the passenger details"
  - "Can I change the number of passengers?"
  - "I need to update my passenger details"
  - "How many passengers are in my reservation?"
  keywords:
  - change passenger details
  - change passenger count
  - add a passenger
  - remove a passenger
  - update name
  - change name
  - change dob
  - update birth date
- id: fetch_change_type
  action: fetch_with_message
  field: passenger_change_type
  comment: passenger_change_type can be 'passenger details' or 'number of 
    passengers'
  message: |
    What would you like to change about the passengers?
    - Passenger details (names, date of birth)
    - Number of passengers

    Please specify which one.

  # Step 2: Check if they want to change number of passengers (not allowed)
- id: check_number_of_passengers_change
  action: conditional
  condition:
    operator: eq
    left: "{{ passenger_change_type }}"
    right: "number of passengers"
  then:
  - id: inform_number_change_not_allowed
    action: reply
    message: "I'm sorry, but the number of passengers cannot be modified after booking.
      You can only update passenger details (names and date of birth) for the existing
      {{ current_number_of_passengers }} passenger(s)."
  else:
        # Step 3: Collect updated passenger details
  - id: collect_updated_passengers_details
    action: fetch_with_condition
    field: updated_passengers_details
    condition:
      operator: eq
      left: "{{ updated_passengers_details }}"
      right: "complete information for all {{ current_number_of_passengers }} travelers,
        each with first_name, last_name, and date_of_birth"

        # Step 4: Ask for confirmation
  - id: confirm_passenger_details_change
    action: fetch_with_message
    field: change_confirmed
    message: |
      You are updating the passenger details for {{ current_number_of_passengers }} passenger(s) in your reservation.

      Updated passenger details:
      {{ updated_passengers_details }}

      Please confirm this change by typing 'yes' or 'no'.

        # Step 5: Check confirmation and update
  - id: check_change_confirmed
    action: conditional
    condition:
      operator: eq
      left: "{{ change_confirmed }}"
      right: "yes"
    then:
    - id: update_reservation_passengers
      action: use_tool
      tool_name: update_reservation_passengers
      input: ["{{ reservation_id }}", "{{ updated_passengers_details }}"]
    - id: confirm_passengers_updated
      action: reply
      message: "The passenger details have been successfully updated for your reservation."
    else:
    - id: inform_change_cancelled
      action: reply
      message: "The passenger details change has been cancelled. Your reservation
        remains unchanged."

---
- workflow: CancelFlight
  when: "user wants to cancel their flight reservation"
  keywords:
  - cancel flight
  - cancel reservation
  - cancel my flight
  - cancel booking
  - flight cancellation

  examples:
  - "I want to cancel my flight"
  - "Can you cancel my reservation?"
  - "I need to cancel my flight booking"
  - "Cancel my flight reservation"

- id: fetch_user_id
  action: fetch
  field: user_id

- id: fetch_reservation_id
  action: fetch_with_condition
  field: reservation_id
  condition: "assistant already asked explicitly for {reservation_id} but user didn't
    provide it"
  then:
  - id: find_reservation_function
    action: use_function
    function: FindReservationId

- id: check_reservation_count
  action: conditional
  condition: "{len(reservations_id)} > 0"
  then:
  - id: inform_one_by_one_reservation
    action: reply
    message: "We will handle the cancellation one by one. and will start with {{ reservations_id[0]
      }} ok?"

  - id: parse_reservation_id
    action: instruction
    instruction: |
      Parse the reservation_id into this format: ['reservation_id', 'reservation_id', 'reservation_id'] and set the variable reservation_id_list to the list.
    set_variable: reservation_id_list

- id: reservation_id_missing
  action: use_tool
  tool_name: transfer_to_human_agents
  input: ["Missing reservation id for flight cancellation"]

- id: escalate_to_human
  action: use_tool
  tool_name: transfer_to_human_agents
  input: ["Reservation ID is missing after attempting to fetch or find."]

- id: loop_over_reservations
  action: loop
  loop_over: reservation_id_list
  loop_variable: reservation_id
  loop_steps:
    # Step 2: Get cancellation reason
  - id: fetch_cancellation_reason
    action: fetch_with_message
    field: cancellation_reason
    message: |
      What is the reason for cancellation? Change of plan / Airline cancelled flight / Other reasons. Please specify the reason.

    # Step 3: Get reservation details to extract flight information
  - id: get_reservation_details
    action: use_tool
    tool_name: get_reservation_details
    input: ["{{ reservation_id }}"]
    set_variable: [flights, created_at, cabin, insurance]

    # Step 4: Loop over flights to collect statuses
  - id: collect_flight_statuses
    action: loop
    loop_over: "{{ flights }}"
    loop_variable: flight
    set_variable: flight_status_list
    subaction:
      action: use_tool
      tool_name: get_flight_status
      input: ["{{ flight.flight_number }}", "{{ flight.date }}"]
    # Step 5: Check if any flight is cancelled or landed
  - id: check_invalid_status
    action: conditional
    condition: "{flight_status_list} contains cancelled or landed"
    then:
    - id: inform_invalid_flight_status
      action: reply
      message: "I'm sorry, but flights that are cancelled or have already landed cannot
        be cancelled."
    else:
          # Step 7: Check cancellation eligibility conditions
    - id: check_booking_within_24hr
      action: instruction
      instruction: |
        Check if the reservation was created within the last 24 hours.

        Steps:
        1. Get the created_at timestamp (format: YYYY-MM-DDTHH:MM:SS)
        2. Get today_date from memory (format: YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS)
        3. Calculate the time difference between today_date and reservation_created_at
        4. If the difference is less than 24 hours, set booking_within_24hr to true, else false

        Note: You may need to parse the datetime strings and calculate hours difference.
        Set booking_within_24hr variable to true or false.
      set_variable: booking_within_24hr

          # Step 9: Check if cabin is business
    - id: check_business_cabin
      action: conditional
      condition: "{cabin} = business"
      then:
      - id: set_business_cabin_true
        action: set_variable
        variable: cabin_is_business
        value: true
      else:
      - id: set_business_cabin_false
        action: set_variable
        variable: cabin_is_business
        value: false

          # Step 10: Check if insurance is yes
    - id: check_insurance
      action: conditional
      condition: "{insurance} = yes"
      then:
      - id: set_insurance_true
        action: set_variable
        variable: has_insurance
        value: true
      else:
      - id: set_insurance_false
        action: set_variable
        variable: has_insurance
        value: false

          # Step 11: Check if at least one cancellation condition is met
    - id: check_cancellation_eligibility
      action: instruction
      instruction: |
        Check if at least one of the following conditions is true:
        1. booking_within_24hr is true
        2. flight_is_cancelled is true
        3. cabin_is_business is true
        4. has_insurance is true

        If at least one is true, set can_cancel to true, else set can_cancel to false.
      set_variable: can_cancel

          # Step 12: Check if cancellation is allowed
    - id: check_if_can_cancel
      action: conditional
      condition: "{can_cancel} = true"
      then:
                # Step 13: Ask for confirmation
      - id: ask_confirmation
        action: fetch_with_message
        field: cancellation_confirmed
        message: |
          I can help you cancel your reservation {{ reservation_id }}.

          The refund will go to the original payment methods within 5 to 7 business days.

          Please confirm that you want to proceed with the cancellation by typing 'yes' or 'no'.

                # Step 14: Check confirmation and cancel
      - id: check_confirmation
        action: conditional
        condition: "{cancellation_confirmed} = yes"
        then:
        - id: cancel_reservation
          action: use_tool
          tool_name: cancel_reservation
          input: ["{{ reservation_id }}"]
        - id: confirm_cancellation
          action: reply
          message: "Your reservation {{ reservation_id }} has been successfully cancelled.
            The refund will be processed to your original payment methods within 5
            to 7 business days."
        else:
        - id: inform_cancellation_cancelled
          action: reply
          message: "The cancellation has been cancelled. Your reservation remains
            active."
      else:
      - id: inform_cannot_cancel
        action: reply
        message: |
          I'm sorry, but your reservation cannot be cancelled at this time.

          Reservations can only be cancelled if at least one of the following conditions is met:
          - The booking was made within the last 24 hours
          - The flight status is cancelled
          - The cabin class is business
          - Travel insurance was purchased

          None of these conditions are currently met for your reservation.


---
- workflow: Refund
  when: "if the user mention he has a problem with a flight or reservation, and he
    wants a refund or compensation"
  keywords:
  - refund
  - compensation
  - money back



  examples:
  - "I want a refund"
  - "I want compensation"
  - "Can I get a refund for my flight?"
  - "Can you refund my flight?"
  - "I want my money back"

- id: check_if_user_asked_explicitly_for_refund
  action: conditional_with_message
  condition: "user did not explicitly ask for a refund or compensation"
  message_on_true: "acknowledge the user's frustration and apologize for the inconvenience.
    say that you appreciate their feedback and will take it into consideration. DO
    NOT mention a refund or compensation at this time."

- id: check_can_cancel_reservation
  action: conditional
  condition: "{can_cancel} = exists and false"
  then:
  - id: inform_can_cancel_reservation
    action: reply
    message: "user is not eligible for cancellation or refund at this time. say to
      him that your a sorry, but you can't cancel your reservation and can't get a
      refund at this time."
  else:
- id: fetch_user_id
  action: fetch
  field: user_id

- id: fetch_reservation_id
  action: fetch_with_condition
  field: reservation_id (which is a 6 letter code)
  condition: "assistant already asked explicitly for reservation id but user didn't
    provide it"
  then:
  - id: find_reservation_function
    action: use_function
    function: FindReservationId



  # Step 2: Get user details to retrieve membership
- id: get_user_details
  action: use_tool
  tool_name: get_user_details
  input: ["{{ user_id }}"]
  set_variable: membership

  # Step 3: Get reservation details to get insurance and cabin
- id: get_reservation_details_initial
  action: use_tool
  tool_name: get_reservation_details
  input: ["{{ reservation_id }}"]
  set_variable: [insurance, cabin, flights, passengers]

  # Step 4: Check if refund is allowed based on membership, insurance, and cabin
- id: check_refund_eligibility
  action: conditional
  condition: "{membership} = regular and {reservation_insurance} = no and {reservation_cabin}
    = economy"
  then:
  - id: inform_refund_not_allowed
    action: reply
    message: "I'm sorry, but refunds are not allowed for regular members with economy
      cabin class and no travel insurance."
  else:
        # Step 5: Fetch the complaint
  - id: fetch_complaint
    action: fetch_with_message
    field: complaint
    message: |
      Please describe your complaint or the reason for requesting a refund. Cancelled flights in the reservation, delayed flights and you want to change or cancel the reservation, or other issues.

        # Step 6: Check if complaint is about cancelled flights
  - id: check_cancelled_flight_complaint
    action: conditional
    condition: "{complaint} contains flight cancelled"
    then:
              # Step 7: Extract flight numbers and dates from reservation
    - id: extract_flight_info_for_cancelled
      action: instruction
      instruction: |
        Extract the flight numbers and dates from the reservation_flights.
        The reservation_flights is a list of ReservationFlight objects, each containing:
        - flight_number: The flight number (e.g., "HAT001")
        - date: The flight date in YYYY-MM-DD format

        Set the following variables:
        - flight_numbers: A list of all flight numbers from the reservation
        - flight_dates: A list of all flight dates from the reservation
      set_variable: [flight_numbers, flight_dates]

              # Step 8: Check if any flight was cancelled
    - id: check_flight_cancelled_status
      action: instruction
      instruction: |
        For each flight in the reservation, check its status using get_flight_status tool.

        Steps:
        1. Iterate through flight_numbers and flight_dates (they should have the same length)
        2. For each pair (flight_number, date), call get_flight_status(flight_number, date)
        3. Collect all flight statuses in a list called flight_statuses
        4. Check if any flight status is "cancelled"
        5. If at least one flight has status "cancelled", set has_cancelled_flight to true, else false

        Available tools:
        - get_flight_status(flight_number: str, date: str) -> str

        The status can be: "available", "on time", "flying", "landed", "cancelled", or "delayed"
      tools_available:
      - get_flight_status
      set_variable: [flight_statuses, has_cancelled_flight]

              # Step 9: Verify cancelled flight and send certificate
    - id: verify_and_send_certificate_cancelled
      action: conditional
      condition: "{has_cancelled_flight} = true"
      then:
                    # Step 10: Calculate number of passengers
      - id: get_number_of_passengers
        action: instruction
        instruction: |
          Get the number of passengers from reservation_passengers.
          reservation_passengers is a list of Passenger objects.
          Set number_of_passengers to the length of this list.
        set_variable: number_of_passengers

                    # Step 11: Calculate certificate amount (100 * number of passengers)
      - id: calculate_certificate_amount_cancelled
        action: use_tool
        tool_name: calculate
        input: ["100 * {{ number_of_passengers }}"]
        set_variable: certificate_amount

                    # Step 12: Send certificate
      - id: send_certificate_cancelled
        action: use_tool
        tool_name: send_certificate
        input: ["{{ user_id }}", "{{ certificate_amount }}"]
                    # Step 13: Confirm refund
      - id: confirm_refund_cancelled
        action: reply
        message: |
          I've verified that a flight in your reservation was cancelled. 
          I've sent a certificate for {{ certificate_amount }} dollars (100 dollars per passenger) to your account.
          The certificate has been added to your payment methods and can be used for future bookings.
      else:
      - id: inform_no_cancelled_flight
        action: reply
        message: "I checked your reservation and did not find any cancelled flights.
          Please verify your complaint or contact customer service for further assistance."
    else:
              # Step 14: Check if complaint is about delayed flights
    - id: check_delayed_flight_complaint
      action: conditional
      condition: "{complaint} contains delayed flight"
      then:
                    # Step 15: Check if user wants to change or cancel
      - id: check_wants_change_or_cancel
        action: fetch_with_message
        field: wants_change_or_cancel
        message: |
          You mentioned a delayed flight. Would you like to change or cancel your reservation?
          Please respond with 'change', 'cancel', or 'no'.

                    # Step 16: Check if user wants change or cancel
      - id: check_change_cancel_response
        action: conditional
        condition: "{wants_change_or_cancel} contains change or cancel"
        then:
                          # Step 18: Check if any flight was delayed
        - id: check_flight_delayed_status
          action: instruction
          instruction: |
            For each flight in the reservation, check its status using get_flight_status tool.

            Steps:
            1. Iterate through flight_numbers and flight_dates (they should have the same length)
            2. For each pair (flight_number, date), call get_flight_status(flight_number, date)
            3. Collect all flight statuses in a list called flight_statuses
            4. Check if any flight status is "delayed"
            5. If at least one flight has status "delayed", set has_delayed_flight to true, else false

            Available tools:
            - get_flight_status(flight_number: str, date: str) -> str

            The status can be: "available", "on time", "flying", "landed", "cancelled", or "delayed"
          tools_available:
          - get_flight_status
          set_variable: [flight_statuses, has_delayed_flight]

                          # Step 19: Verify delayed flight and send certificate
        - id: verify_and_send_certificate_delayed
          action: conditional
          condition: "{has_delayed_flight} = true"
          then:
                                # Step 20: Calculate number of passengers
          - id: get_number_of_passengers_delayed
            action: instruction
            instruction: |
              Count the number of passengers from the passengers variable in memory.
              The passengers variable is a list of Passenger objects that was set from get_reservation_details.
              Set number_of_passengers to the length of this list.
            set_variable: number_of_passengers

                                # Step 21: Calculate certificate amount (50 * number of passengers)
          - id: calculate_certificate_amount_delayed
            action: use_tool
            tool_name: calculate
            input: ["50 * {{ number_of_passengers }}"]
            set_variable: certificate_amount

                                # Step 22: Send certificate
          - id: send_certificate_delayed
            action: use_tool
            tool_name: send_certificate
            input: ["{{ user_id }}", "{{ certificate_amount }}"]
                                # Step 23: Confirm refund
          - id: confirm_refund_delayed
            action: reply
            message: |
              I've verified that a flight in your reservation was delayed and you want to {{ wants_change_or_cancel }} your reservation.
              I've sent a certificate for {{ certificate_amount }} dollars (50 dollars per passenger) to your account.
              The certificate has been added to your payment methods and can be used for future bookings.
          else:
          - id: inform_no_delayed_flight
            action: reply
            message: "I checked your reservation and did not find any delayed flights.
              Please verify your complaint or contact customer service for further
              assistance."
        else:
        - id: inform_no_change_cancel
          action: reply
          message: "Since you don't want to change or cancel your reservation, I cannot
            process a refund for delayed flights. If you change your mind, please
            let me know."
      else:
      - id: inform_other_complaint
        action: reply
        message: |
          I understand your complaint. However, refunds are only available for:
          - Cancelled flights in the reservation
          - Delayed flights when you want to change or cancel your reservation

          For other issues, please contact customer service for assistance.


