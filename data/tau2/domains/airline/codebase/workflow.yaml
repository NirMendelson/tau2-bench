subworkflow: FindReservationId
when: "user doesn't know their reservation ID or asks to find their reservation"

keywords:
  - find reservation
  - reservation ID
  - my reservation
  - what is my reservation
  - I don't know my reservation ID
  - forgot reservation ID
  - lost reservation number
  - find my reservation

examples:
  - "I don't know my reservation ID"
  - "Can you help me find my reservation?"
  - "What is my reservation number?"
  - "I forgot my reservation ID"
  - "I lost my reservation number"
  - "How do I find my reservation?"

steps:
  # Step 1: Get user ID
  - id: fetch_user_id
    action: fetch
    field: user_id
  
  # Step 2: Get user details to retrieve reservations list
  - id: get_user_details
    action: use_tool
    tool_name: get_user_details
    input: ["{{ user_id }}"]
    set_variables:
      reservations_list: reservations
  
  # Step 3: Check number of reservations
  - id: check_reservation_count
    action: conditional
    condition: "{len(reservations_list)} = 0"
    then:
      steps:
        - id: inform_no_reservations
          action: reply
          message: "I found no reservations associated with your account. Please make sure you're using the correct user ID."
    else:
      steps:
        - id: check_single_reservation
          action: conditional
          condition: "{len(reservations_list)} = 1"
          then:
            steps:
              
              # User has only one reservation - return it directly
              - id: set_single_reservation_id
                action: set_variable
                variable: reservation_id
                value: "{{ reservations_list[0] }}"

              - id: return_single_reservation_id
                action: reply
                message: "I found one reservation in your account. Your reservation ID is {{ reservations_list[0] }}."
          else:
            steps:
              # User has multiple reservations - need to ask for origin/destination
              - id: fetch_flight_details
                action: fetch_with_message
                fields:
                  - origin
                  - destination
                message: |
                  To help me identify which reservation you're looking for, please provide: origin and destination for the reservation.
              
              # Step 4: Fetch details for all reservations loop
              - id: fetch_all_reservation_details
                action: loop
                loop_over: reservations_list
                loop_variable: reservation_id
                set_variable: all_reservation_details
                subaction:
                  action: use_tool
                  tool_name: get_reservation_details
                  input: ["{{ reservation_id }}"]
                  set_variables:
                    - reservation_id
                    - origin
                    - destination

              # Step 5: Find matching reservation from memory
              - id: find_matching_reservation
                action: instruction
                instruction: |
                  I have fetched the details for each reservation in the reservations_list.
                  
                  all_reservation_details: {{ all_reservation_details }}
                  
                  Find the reservation ID from all_reservation_details where:
                  - The origin matches {{ origin }}
                  - The destination matches {{ destination }}
                  
                  Return the reservation ID. If no match is found, return null.
                set_variable: matching_reservation_id
              
              # Step 5: Check if a match was found
              - id: check_match_found
                action: conditional
                condition: "{matching_reservation_id} = null"
                then:
                  steps:
                    - id: inform_no_match_found
                      action: reply
                      message: "I couldn't find a reservation matching {{ origin }} to {{ destination }}. Please verify the airport codes and try again, or contact customer service for assistance."
                else:
                  steps:
                    - id: set_matched_reservation_id
                      action: set_variable
                      variable: reservation_id
                      value: "{{ matching_reservation_id }}"


