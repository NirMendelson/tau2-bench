- workflow: GivingCheckedBagInformation
  when: "user asks about checked bag allowance or baggage information"
  keywords:
  - checked bag allowance
  - baggage information
  - checked bags
  - baggage
  - bag allowance
  - bag information
  - bag allowance

  examples:
  - "How many checked bags can I bring?"
  - "What is the checked bag allowance?"
  - "Can I bring a checked bag?"
  - "What is the baggage information?"
  - "How many bags can I bring?"
  - "What is the bag allowance?"
  - "Can I bring a bag?"
  - "What is the bag information?"

- id: fetch_user_id
  action: fetch
  field: user_id
  # Step 3: Get user details to retrieve membership status
- id: get_user_details
  action: use_tool
  tool_name: get_user_details
  input: ["{{ user_id }}"]
  set_variable: membership

- id: fetch_reservation_id
  action: fetch
  field: reservation_id
  comment: "the reservation_id is a 6 letter code, users sometimes refer to it as
    confirmation code."

- id: get_reservation_details
  action: use_tool
  tool_name: get_reservation_details
  input: ["{{ reservation_id }}"]
  set_variable: [cabin, passengers]

  # Step 4: Count number of passengers
- id: count_passengers
  action: instruction
  instruction: |
    Count the number of passengers from the passengers variable in memory.
    The passengers variable is a list of Passenger objects that was set from get_reservation_details.
    Set number_of_passengers to the length of this list.
  set_variable: number_of_passengers

  # Step 5: Calculate free checked bags based on membership and cabin
- id: calculate_free_bags
  action: conditional
  condition: "{membership} = regular"
  then:
  - id: check_regular_cabin
    action: conditional
    condition: "{cabin} = basic_economy"
    then:
    - id: set_free_bags
      action: set_variable
      variable: free_checked_bags_per_passenger
      value: 0
    else:
    - id: check_regular_economy
      action: conditional
      condition: "{cabin} = economy"
      then:
      - id: set_free_bags
        action: set_variable
        variable: free_checked_bags_per_passenger
        value: 1
      else:
      - id: set_free_bags
        action: set_variable
        variable: free_checked_bags_per_passenger
        value: 2
  else:
  - id: check_silver
    action: conditional
    condition: "{membership} = silver"
    then:
    - id: check_silver_cabin
      action: conditional
      condition: "{cabin} = basic_economy"
      then:
      - id: set_free_bags
        action: set_variable
        variable: free_checked_bags_per_passenger
        value: 1
      else:
      - id: check_silver_economy
        action: conditional
        condition: "{cabin} = economy"
        then:
        - id: set_free_bags
          action: set_variable
          variable: free_checked_bags_per_passenger
          value: 2
        else:
        - id: set_free_bags
          action: set_variable
          variable: free_checked_bags_per_passenger
          value: 3
    else:
            # Must be gold member
    - id: check_gold_cabin
      action: conditional
      condition: "{cabin} = basic_economy"
      then:
      - id: set_free_bags
        action: set_variable
        variable: free_checked_bags_per_passenger
        value: 2
      else:
      - id: check_gold_economy
        action: conditional
        condition: "{cabin} = economy"
        then:
        - id: set_free_bags
          action: set_variable
          variable: free_checked_bags_per_passenger
          value: 3
        else:
        - id: set_free_bags
          action: set_variable
          variable: free_checked_bags_per_passenger
          value: 3

- id: calculate_total_checked_bags
  action: use_tool
  tool_name: calculate
  input: ["{{ free_checked_bags_per_passenger }} * {{ number_of_passengers }}"]
  set_variable: total_checked_bags
  # Step 6: Reply with checked bag information
- id: reply_checked_bag_info
  action: reply
  message: "You have a membership of {{ membership }} and on cabin {{ cabin }} therefore
    eligible for {{ free_checked_bags_per_passenger }} free checked bags per passenger.
    You are {{ number_of_passengers }} passengers and therefore have a total of {{
    total_checked_bags }} free bags"

